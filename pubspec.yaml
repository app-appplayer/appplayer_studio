name: appplayer_studio
description: >
  AppPlayer Studio — universal desktop host that loads any installed domain
  bundle (.mcpb) into a workspace. Bundles ship their own MCP endpoints and
  DSL UI; the host is a universal launcher.
version: 0.1.7
homepage: https://appplayer.app
repository: https://github.com/app-appplayer/appplayer_studio
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  args: ^2.5.0
  collection: ^1.18.0
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.0
  path: ^1.9.0
  mcp_bundle: ^0.4.8
  # Direct dep to pin the EthosStoreDelete-capable adapter (KvEthosStoreAdapter,
  # re-exported via mcp_knowledge) — transitive resolution can pick an older
  # 0.1.2 that lacks it. Used by ops workspace purge (charter ethos cleanup).
  mcp_philosophy: ^0.1.3
  google_fonts: ^6.2.1
  video_player: ^2.9.1
  meta: ^1.15.0
  logging: ^1.2.0
  archive: ^3.6.1
  crypto: ^3.0.3
  shelf: ^1.4.0
  mcp_server: ^2.1.2
  mcp_client: ^2.1.1
  mcp_llm: ^2.1.1
  flutter_mcp_ui_runtime: ^0.5.3
  flutter_mcp_ui_core: ^0.4.3
  json_schema: ^5.1.1
  flutter_js: ^0.8.7
  ffmpeg_kit_flutter_new: ^3.0.0
  file_selector: ^1.0.3
  flowbrain_core: ^0.1.8
  flutter_riverpod: ^2.5.1
  mcp_browser: ^0.1.3
  mcp_channel: ^0.2.1
  mcp_form: ^0.2.0
  mcp_ingest: ^0.1.1
  mcp_io: ^0.2.2
  mcp_io_process: ^0.1.1
  mcp_io_modbus: ^0.2.1
  mcp_io_mqtt: ^0.2.1
  mcp_io_http: ^0.2.1
  mcp_io_scpi: ^0.2.1
  # Capability packages adopted via the vendored capability_tools recipe
  # (canvas / analysis / datastore fs+db). All published (datastore contract
  # lives in mcp_bundle ^0.4.5); resolves hosted-clean, no override.
  mcp_canvas: ^0.1.0
  mcp_analysis: ^0.1.4
  mcp_datastore: ^0.1.0
  mcp_datastore_sqlite: ^0.1.0
  flutter_mcp_ui_generator: ^0.4.1
  mcp_knowledge: ^0.2.5
  mcp_fact_graph: ^0.2.3
  # Direct dep (was transitive via mcp_knowledge) so the host can wire the
  # real Decision port + engines into the per-project OpsRuntime / ProfileRuntime
  # (judgment-determinism). flowbrain_core re-exports EnginePorts but not the
  # concrete mcp_profile impls/adapters.
  mcp_profile: ^0.2.1
  # Direct dep (was transitive via brain_kernel) so the host can inject the
  # PERSISTENT behavior StateStore (KvStateStore over the per-project KV)
  # into BundleActivation — without it suspended approval runs live in the
  # in-memory default and die on restart (zombie pending; 2026-07-04).
  mcp_knowledge_ops: ^0.2.2
  uuid: ^4.0.0
  yaml: ^3.1.2
  # Published AppPlayer utility packages (pub.dev): UI view widgets, the
  # Claude Code provider, and signature/secure helpers.
  appplayer_form_view: ^0.1.0
  appplayer_ui_view: ^0.1.0
  appplayer_claude_code_provider: ^0.1.1
  appplayer_secure: ^0.1.1
  brain_kernel: ^0.2.0
  # Extension-transport FFI home (serial / usb / ble / tcp / ws). Desktop
  # opt-in — the kernel / mcp_client / mcp_server cores stay FFI-free; the
  # `mcp.connect_extension` tool (vendored extension_transport recipe) builds
  # these transports and injects them via the kernel seam (`connectExtension`
  # helper off the abstract client host, spec 08 §4).
  mcp_bridge: ^0.2.0-rc.2
  # Board discovery (vendored ble_transport / device_discovery recipes,
  # spec 16/17): BLE scan+GATT transport, mDNS `_mcp._tcp` browse, LDAP
  # directory scan. mcp_client above carries the probe.
  universal_ble: ^2.1.0
  multicast_dns: ^0.3.3
  dartdap: ^0.11.0
  # Serial port enumeration for the usb discovery source (same package
  # mcp_bridge's serial transport rides on).
  clib_serialport_dart: ^1.1.0

  device_info_plus: ^10.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  watcher: ^1.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  async: ^2.13.1
# Local dev-latest overrides live in `pubspec_overrides.yaml` (gitignored)
# so this committed pubspec stays release-clean (published versions only)
# and a fresh clone resolves everything from pub.dev.

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    # Board-discovery trust anchors (spec 17 §6) — dev partner / marketplace
    # root CAs the signature evaluator validates against.
    - assets/root_cas/
    # App Builder seed templates. Flutter does not recurse into asset
    # directories, so each one is declared explicitly.
    - lib/src/apps/app_builder/seed/app_player_app/
    - lib/src/apps/app_builder/seed/app_player_app/ui/
    - lib/src/apps/app_builder/seed/app_player_app/ui/pages/
    - lib/src/apps/app_builder/seed/studio_package/
    - lib/src/apps/app_builder/seed/studio_package/ui/
    - lib/src/apps/app_builder/seed/studio_package/ui/pages/
    - lib/src/apps/app_builder/seed/cloud_server_app/
    - lib/src/apps/app_builder/seed/cloud_server_app/ui/
    - lib/src/apps/app_builder/seed/cloud_server_app/ui/pages/
    - lib/src/apps/app_builder/seed/cloud_server_app/tools/
    - lib/src/apps/ops/seed/project/
    - lib/src/apps/ops/seed/project/project.mbd/
    - lib/src/apps/ops/seed/workspace/
